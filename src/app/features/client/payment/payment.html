<div class="modal-backdrop" (click)="closeModal()">
  <div class="payment-modal" (click)="$event.stopPropagation()">

    <button (click)="closeModal()" class="modal-close">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <div class="payment-step animate-fade-in">
      <div class="step-header">
        <h2 class="step-title">{{ t.t('payment_secure_title') }}</h2>
        <p class="step-subtitle">{{ serviceNom }} — {{ dureeLabel }}</p>
      </div>

      <div class="payment-footer">
        <div class="total-row">
          <span class="total-label">{{ t.t('kpi_total') }}:</span>
          <span class="total-amount">{{ amount }} TND</span>
        </div>

        <button (click)="pay()" [disabled]="isProcessing()" class="btn btn-primary btn-lg w-full">
          @if (isProcessing()) {
            <svg class="spinner" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            {{ t.t('payment_processing') }}
          } @else {
            {{ t.t('payment_pay_via') }} {{ amount }} TND via Stripe
          }
        </button>
      </div>
    </div>

  </div>
</div>
