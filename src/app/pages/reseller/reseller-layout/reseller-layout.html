<div class="shell">
  <app-sidebar [items]="navItems()" [user]="sidebarUser" />
  <div class="right-side">
    <app-navbar
      brandKey="topbar_reseller"
      [showSearch]="true"
      [showSupport]="true"
      [searchResults]="searchResults"
      [isDark]="isDark"
      [navbarUser]="navbarUser"
      notifPortal="reseller"
      (search)="onSearch($event)"
      (searchNavigate)="onSearchNavigate($event)"
      (darkToggle)="onDarkToggle()"
      (profileClick)="goToProfile()"
      (supportClick)="openSupport()"
      (logoutClick)="logout()" />
    <main class="main-content">
      <router-outlet />
    </main>
  </div>
</div>
<app-toast />
