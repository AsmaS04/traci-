<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" x2="3" y1="12" y2="12"/>
        </svg>
      </div>
      <h1 class="logo-text">{{ ts.t('login_traci') }}</h1>
      <h2>{{ ts.t('ra_title') }}</h2>
      <p class="subtitle">{{ ts.t('ra_subtitle') }}</p>
    </div>

    <div class="login-form">
      @if (success) {
        <div class="success-message">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          <p>{{ ts.t('ra_success') }}</p>
          <p class="success-sub">{{ ts.t('ra_success_sub') }}</p>
          <a class="back-link" [routerLink]="role === 'CLIENT' ? '/client' : '/bo-admin-access'">
            {{ ts.t('ra_back') }}
          </a>
        </div>
      } @else {
        @if (error) {
          <div class="error-message">{{ error }}</div>
        }

        <label>{{ ts.t('ra_email_label') }}</label>
        <div class="input-group">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
          </span>
          <input
            type="email"
            [(ngModel)]="email"
            [placeholder]="ts.t('ra_email_placeholder')"
          />
        </div>

        <label>{{ ts.t('ra_role_label') }}</label>
        <div class="role-selector">
          <button
            class="role-btn"
            [class.active]="role === 'CLIENT'"
            (click)="role = 'CLIENT'"
          >
            {{ ts.t('ra_role_client') }}
          </button>
          <button
            class="role-btn"
            [class.active]="role === 'RESELLER'"
            (click)="role = 'RESELLER'"
          >
            {{ ts.t('ra_role_reseller') }}
          </button>
        </div>

        <button
          class="login-btn"
          (click)="onSubmit()"
          [disabled]="loading || !email"
        >
          {{ loading ? ts.t('ra_loading') : ts.t('ra_submit') }}
        </button>

        <p class="switch-link">
          <a [routerLink]="role === 'CLIENT' ? '/client' : '/bo-admin-access'">
            {{ ts.t('ra_back') }}
          </a>
        </p>
      }
    </div>
  </div>
</div>
